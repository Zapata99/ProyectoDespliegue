services:
  django:
    build: .
    container_name: proyectodespliegue-django
    restart: unless-stopped
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - django_data:/data

volumes:
  django_data:
